name: Build windows

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]
  workflow_call:
    inputs:
      build-mode:
        type: string
        default: releasedbg
      skyrim-version:
        type: string
        default: ''
      upload-build-for-next-job:
        type: boolean
        default: false

env:
  BUILD_MODE: ${{ inputs.build-mode || 'releasedbg' }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x64]
        skyrim-version: ${{ fromJSON(inputs.skyrim-version && format('["{0}"]', inputs.skyrim-version) || '["1.6.1170","latest"]') }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.skyrim-version }}-${{ inputs.build-mode || 'releasedbg' }}-windows
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    env:
      SKYRIM_VERSION: ${{ matrix.skyrim-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Checkout submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1
      - uses: actions/cache@v6
        with:
          path: ~/AppData/Local/.xmake/packages
          key: windows-full-x64-${{ env.BUILD_MODE }}-${{ matrix.skyrim-version }}-3.1.0-source-gns-${{ hashFiles('**/xmake.lua') }}
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.0'
      - name: Configure exact runtime
        run: |
          xmake config --plat=windows --arch=x64 --mode="$BUILD_MODE" --skyrim_version="$SKYRIM_VERSION" --builddir="build/$SKYRIM_VERSION" --yes -vD
          echo "STR_BUILD_DIR=build/$SKYRIM_VERSION/windows/x64/$BUILD_MODE" >> "$GITHUB_ENV"
      - name: Build all product and test targets
        run: xmake -y
      - name: Run complete TPTests with permanent summary
        shell: pwsh
        run: |
          $testTemp = Join-Path $env:RUNNER_TEMP "tpq"
          New-Item -ItemType Directory -Force -Path $testTemp | Out-Null
          $env:TEMP = $testTemp
          $env:TMP = $testTemp
          xmake run TPTests *> windows-tptests.log
          $testStatus = $LASTEXITCODE
          Get-Content windows-tptests.log | Write-Host
          exit $testStatus
      - name: Install runtime files
        run: |
          xmake install -o distrib
          cp -rf distrib/bin/* "$STR_BUILD_DIR/"
      - name: Generate server configuration
        run: |
          "$STR_BUILD_DIR/SkyrimTogetherServer.exe" --generate-config "$STR_BUILD_DIR/config/STServer.ini"
          cat "$STR_BUILD_DIR/config/STServer.ini"
      - name: Stage SKSE lineage bridge
        shell: pwsh
        run: |
          $plugin = Join-Path $env:STR_BUILD_DIR "SkyrimTogetherLineageBridge.dll"
          if (-not (Test-Path -LiteralPath $plugin -PathType Leaf)) {
            throw "Missing SKSE lineage bridge: $plugin"
          }
          $pluginDir = "GameFiles/Skyrim/SKSE/Plugins"
          New-Item -ItemType Directory -Force -Path $pluginDir | Out-Null
          Copy-Item -LiteralPath $plugin -Destination (Join-Path $pluginDir "SkyrimTogetherLineageBridge.dll") -Force
          Remove-Item -LiteralPath $plugin
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: lts/iron
          cache: pnpm
          cache-dependency-path: Code/skyrim_ui/pnpm-lock.yaml
      - name: Build UI
        run: |
          pnpm --prefix Code/skyrim_ui/ install --frozen-lockfile
          pnpm --prefix Code/skyrim_ui/ deploy:production
          cp -r Code/skyrim_ui/dist/UI "$STR_BUILD_DIR/"
      - name: Upload candidate for isolated live validation
        uses: actions/upload-artifact@v7
        with:
          name: equal-party-live-windows-x64-${{ matrix.skyrim-version }}-${{ github.sha }}
          retention-days: 3
          if-no-files-found: error
          path: |
            ${{ env.STR_BUILD_DIR }}/
            GameFiles/Skyrim/
      - name: Resolve safe artifact version
        if: inputs.upload-build-for-next-job
        shell: pwsh
        run: |
          $raw = git describe --tags --always
          if ($LASTEXITCODE -ne 0) { throw "Cannot identify artifact version" }
          $safe = $raw -replace '[\\/:*?"<>|\r\n]', '-'
          if ([string]::IsNullOrWhiteSpace($safe)) { $safe = "${{ github.sha }}" }
          "ARTIFACT_VERSION=$safe" >> $env:GITHUB_ENV
      - name: Package playable build and debug symbols
        if: inputs.upload-build-for-next-job
        run: |
          mkdir -p str-build/SkyrimTogetherReborn str-pdb release-assets
          cp -r "$STR_BUILD_DIR"/* str-build/SkyrimTogetherReborn/
          cp -r GameFiles/Skyrim/* str-build/
          find str-build/SkyrimTogetherReborn -maxdepth 1 -name '*.pdb' -exec cp {} str-pdb/ \;
          rm -f str-build/SkyrimTogetherReborn/*.pdb str-build/SkyrimTogetherReborn/*.lib str-build/SkyrimTogetherReborn/*.exp str-build/SkyrimTogetherReborn/*Tests.exe
          (cd str-build && 7z a -tzip "../release-assets/SkyrimTogether-${ARTIFACT_VERSION}-windows-x64-${SKYRIM_VERSION}.zip" .)
          (cd str-pdb && 7z a -tzip "../release-assets/SkyrimTogether-${ARTIFACT_VERSION}-windows-x64-${SKYRIM_VERSION}-debug-symbols.zip" .)
      - name: Upload packaged artifacts
        if: inputs.upload-build-for-next-job
        uses: actions/upload-artifact@v7
        with:
          name: SkyrimTogether-${{ env.ARTIFACT_VERSION }}-windows-x64-${{ matrix.skyrim-version }}
          retention-days: 7
          if-no-files-found: error
          path: release-assets/*.zip
      - name: Preserve test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-tests-${{ matrix.skyrim-version }}-${{ github.sha }}
          path: windows-tptests.log
          retention-days: 7
