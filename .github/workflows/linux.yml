name: Build linux

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]
  workflow_call:
    inputs:
      build-mode:
        type: string
        default: releasedbg
      upload-build-for-next-job:
        type: boolean
        default: false

env:
  BUILD_MODE: ${{ inputs.build-mode || 'releasedbg' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.build-mode || 'releasedbg' }}-linux-x64
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Checkout submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1
      - name: Install matching protobuf generator
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y protobuf-compiler
          protoc --version | grep -E '^libprotoc 3\.12\.'
      - uses: actions/cache@v6
        with:
          path: ~/.xmake/packages
          key: linux-full-x64-${{ env.BUILD_MODE }}-3.1.0-protobuf3.12-${{ hashFiles('**/xmake.lua') }}
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.0'
      - name: Configure and preserve failure diagnostics
        shell: bash
        run: |
          set +e
          timeout 15m xmake config --arch=x86_64 --mode="$BUILD_MODE" --yes -vD > config.log 2>&1
          status=$?
          cat config.log
          if (( status != 0 )); then
            find "$HOME/.xmake/cache/packages" -path '*/installdir.failed/logs/install.txt' -type f -exec tail -n 200 {} \; 2>/dev/null
          fi
          exit "$status"
      - name: Build server and shared targets
        run: xmake -y
      - name: Run complete TPTests
        shell: bash
        run: |
          set -o pipefail
          timeout 10m xmake run TPTests 2>&1 | tee linux-tptests.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-validation-${{ github.sha }}
          path: |
            config.log
            linux-tptests.log
          retention-days: 7
